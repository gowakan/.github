name: Bug
description: Something that does not work as expected
type: Bug
projects: ["gowakan/3"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What is wrong?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      value: |
        1. 
        2. 
        3. 
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Result
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "Dev / Prod · Build version · Device and OS"
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Screenshot, video, or API request and response
  - type: input
    id: related
    attributes:
      label: Related
      description: Parent feature or original ticket
      placeholder: "#123"
