name: Feature
description: A new feature or user story (parent ticket)
type: Feature
projects: ["gowakan/3"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What are we building, in one or two sentences?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: The user or business problem this solves.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      value: |
        - [ ] 
        - [ ] 
    validations:
      required: true
  - type: input
    id: designs
    attributes:
      label: Designs
      description: Figma link
  - type: textarea
    id: notes
    attributes:
      label: Dependencies / Notes
      description: Anything that could block or affect this feature. Sub-tickets ([Design], [Backend], [Mobile], [Microsite], [Yakan360], [DataPipeline]) are added as sub-issues after creation.
